name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: test-suites
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Unit tests
        run: pytest -c src/streamlit/tests/pytest.ini src/streamlit/tests/unit -m "unit"

      - name: Integration tests
        run: pytest -c src/streamlit/tests/pytest.ini src/streamlit/tests/integration -m "integration"

      - name: Security tests
        run: pytest -c src/streamlit/tests/pytest.ini src/streamlit/tests/security -m "security"

      - name: ML non-regression tests
        run: pytest -c src/streamlit/tests/pytest.ini src/streamlit/tests/ml -m "ml and regression"

      - name: E2E smoke test
        run: pytest -c src/streamlit/tests/pytest.ini src/streamlit/tests/e2e -m "e2e and smoke"
